name: Deploy fork to production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag, or commit SHA)
        required: false
        default: main
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROD_INSTANCE_ID: ${{ vars.PROD_INSTANCE_ID }}

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    name: Deploy to ai-omniroute
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      REPO_URL: https://github.com/${{ github.repository }}.git
    steps:
      - name: Validate configuration
        run: |
          test -n "$PROD_INSTANCE_ID" || { echo "PROD_INSTANCE_ID is not set"; exit 1; }
          test -n "$DEPLOY_REF" || { echo "DEPLOY_REF is not set"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command over SSM
        id: deploy
        env:
          DEPLOY_SCRIPT: |
            set -euo pipefail
            export PATH=/home/omniroute/.local/bin:/opt/node22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            REPO_DIR=/home/omniroute/OmniRoute
            REPO_URL=__REPO_URL__
            DEPLOY_REF=__DEPLOY_REF__

            if [ ! -d "$REPO_DIR/.git" ]; then
              mkdir -p "$(dirname "$REPO_DIR")"
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin --tags --prune
            git checkout --force "$DEPLOY_REF"
            git reset --hard "$DEPLOY_REF"
            git clean -fdx

            npm ci --no-audit --no-fund
            JWT_SECRET=ci-deploy-secret-with-sufficient-length-for-validation node scripts/prepublish.mjs
            npm install -g "$REPO_DIR"

            pm2 restart omniroute || pm2 start omniroute --name omniroute -- --port 20128
            pm2 save

            curl -fsS http://127.0.0.1:20128/login >/dev/null
            omniroute --version
        run: |
          export DEPLOY_SCRIPT_RENDERED="${DEPLOY_SCRIPT//__REPO_URL__/$REPO_URL}"
          export DEPLOY_SCRIPT_RENDERED="${DEPLOY_SCRIPT_RENDERED//__DEPLOY_REF__/$DEPLOY_REF}"
          COMMANDS_JSON=$(python3 - <<'PY'
          import json, os
          script = os.environ["DEPLOY_SCRIPT_RENDERED"]
          commands = [
              "cat >/tmp/omniroute-deploy.sh <<'EOF'",
              *script.splitlines(),
              "EOF",
              "chown omniroute:omniroute /tmp/omniroute-deploy.sh",
              "chmod 700 /tmp/omniroute-deploy.sh",
              "runuser -l omniroute -c '/bin/bash /tmp/omniroute-deploy.sh'",
          ]
          print(json.dumps({"commands": commands}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$PROD_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $DEPLOY_REF from $REPO_URL" \
            --parameters "$COMMANDS_JSON" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to finish
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$PROD_INSTANCE_ID" \
              --query 'Status' \
              --output text)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$PROD_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$PROD_INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for deploy command $COMMAND_ID"
          exit 1
